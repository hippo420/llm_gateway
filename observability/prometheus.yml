# docs/operations/observability-stack.md "3. prometheus.yml"
global:
  # 진단 주기(1분)와 정렬. 더 짧게 잡으면 저장량만 늘고 판단은 나아지지 않는다.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/experiment-alerts.yml
  - /etc/prometheus/policy-alerts.yml

scrape_configs:
  # Compose 네트워크에서 Gateway 컨테이너를 직접 조회한다.
  - job_name: llm-gateway
    static_configs:
      - targets: ["gateway:35000"]
        labels: { service: llm-gateway }

  # Ollama 는 Prometheus /metrics 를 노출하지 않는다 (404). 서빙 부하는
  # llm_gateway_inflight_requests 로 대체한다. 노출하는 버전이 나오면 주석을 푼다.
  # - job_name: ollama
  #   static_configs:
  #     - targets: ["host.docker.internal:11434"]
  #       labels: { serving: ollama }

  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { serving: vllm }

  # Spring 앱(mony_batch) - mony_llm_call_seconds / mony_llm_context_seconds (spring/phase-02)
  # local 프로파일 server.port=21820. dev 는 31820.
  - job_name: mony-batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:21820"]
        labels: { service: mony-batch }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["host.docker.internal:9835"]
