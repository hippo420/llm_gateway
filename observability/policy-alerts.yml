groups:
  - name: gateway-policy
    rules:
      - alert: GatewayPolicyControllerFailing
        expr: increase(llm_gateway_policy_loop_errors_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 'Policy controller failed to complete an evaluation'
          description: 'Inspect policy_loop_failed logs and audit journal integrity before resuming.'
      - alert: GatewayAutomaticChangeApplied
        expr: increase(llm_gateway_auto_remediation_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Automatic policy {{ $labels.policy_id }} applied'
          description: 'Inspect authenticated /admin/automation-journal; manual rollback is available.'
      - alert: GatewayPolicyAuditUnavailable
        expr: llm_gateway_policy_store_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Policy audit store is unavailable or corrupt'
          description: 'Approval and rollback require Redis recovery. Inspect Gateway logs.'
      - alert: GatewayPolicyApprovalPending
        expr: llm_gateway_policy_pending > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: 'Policy {{ $labels.policy_id }} requires human approval'
          description: 'Inspect authenticated GET /admin/recommendations. No automatic approval.'
      - alert: GatewayPolicyRollbackConflict
        expr: llm_gateway_policy_rollback_conflicts > 0
        labels:
          severity: critical
        annotations:
          summary: 'Policy {{ $labels.policy_id }} needs rollback review'
          description: 'Configuration changed after approval. Inspect /admin/policy-history.'
