# Phase 2 관측 스택. docs/operations/observability-stack.md
#
#   docker compose up -d                    prometheus + grafana + node-exporter
#   docker compose --profile gpu up -d      + nvidia exporter (컨테이너 GPU 접근이 될 때)
#
# Gateway는 컨테이너 :35000, Ollama는 Docker 호스트 :11434에서 실행한다.
#
# 호스트 포트는 환경변수로 바꿀 수 있다. Windows 는 Hyper-V/WinNAT 가 포트 대역을 예약해서
# 3000 같은 포트가 막혀 있을 수 있다 (`netsh interface ipv4 show excludedportrange protocol=tcp`).
#   GRAFANA_PORT=3300 docker compose up -d
services:
  gateway:
    build: .
    restart: unless-stopped
    ports: ["35000:35000"]
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "35000"
      GATEWAY_CONFIG_PATH: config/gateway.docker.yaml
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      GATEWAY_REDIS_URL: "${GATEWAY_REDIS_URL:-}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./config:/app/config:ro
      - gateway-evaluations:/app/operations/evaluations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:35000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:7-alpine
    profiles: [config]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    # Overrides retain TTL; Phase 9 audit history must survive container recreation.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:latest
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/experiment-alerts.yml:/etc/prometheus/experiment-alerts.yml:ro
      - ./observability/policy-alerts.yml:/etc/prometheus/policy-alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:latest
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # Docker Desktop 에서는 Windows 가 아니라 WSL VM 의 CPU/RAM 을 보여준다.
  # 호스트 자체 지표가 필요하면 windows_exporter(:9182) 를 호스트에 띄울 것.
  node-exporter:
    image: prom/node-exporter:latest
    ports: ["9100:9100"]

  # WSL 에서 컨테이너 GPU 접근이 안 되면 이 서비스 대신 Windows 용 바이너리를
  # 호스트에서 :9835 로 띄운다. prometheus 는 어느 쪽이든 host.docker.internal:9835 를 긁는다.
  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    profiles: [gpu]
    ports: ["9835:9835"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  gateway-evaluations:
  redis-data:
  prometheus-data:
  grafana-data:
