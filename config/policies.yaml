# Disabled by default. Calibrate diagnosis targets before enabling any policy.
# Restart Gateway to load changes to this file.
interval_sec: 15
max_active: 1
max_changes_per_hour: 4
max_pending: 20
auto_remediation:
  enabled: false
  max_changes_per_hour: 2
  max_changes_per_day: 6
  max_weight_step: 10
  min_human_decisions: 30
  min_agreement: 0.95
  demote_after_rollbacks: 2
  promote_after_successes: 10
policies: []

